<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AACKS Group CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f1f3f6;--border:#e2e5ea;--border-strong:#cdd3db;
  --text:#17202a;--muted:#5d6874;--faint:#8a94a0;
  --primary:#1d3557;--primary-hover:#142847;--primary-ink:#fff;--primary-soft:#e5ebf4;
  --accent:#d0571f;--accent-soft:#fbe9df;
  --ok:#17784c;--ok-soft:#e0f2e9;--warn:#9a5d06;--warn-soft:#fbf0d8;
  --danger:#bd3328;--danger-soft:#fbe3e0;--info:#2a5fb0;--info-soft:#e2ecfa;
  --c-in:#2a5fb0;--c-out:#d0571f;
  --side:#13233a;--side-text:#b9c5d3;--side-hover:#1c3150;--side-active:#24406a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --radius:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a;--surface:#161d26;--surface-2:#1c2530;--border:#28323e;--border-strong:#36414f;
  --text:#e5eaf0;--muted:#9aa5b2;--faint:#76818e;
  --primary:#6fa3df;--primary-hover:#8ab6e8;--primary-ink:#0e131a;--primary-soft:#1d2d42;
  --accent:#f08a50;--accent-soft:#3a2518;
  --ok:#4cc38a;--ok-soft:#14301f;--warn:#e3a740;--warn-soft:#352812;
  --danger:#f0776b;--danger-soft:#3a1a17;--info:#6fa3df;--info-soft:#172a42;
  --c-in:#6fa3df;--c-out:#f08a50;
  --side:#0b1018;--side-text:#a9b5c3;--side-hover:#16202d;--side-active:#1d2d42;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131a;--surface:#161d26;--surface-2:#1c2530;--border:#28323e;--border-strong:#36414f;
  --text:#e5eaf0;--muted:#9aa5b2;--faint:#76818e;
  --primary:#6fa3df;--primary-hover:#8ab6e8;--primary-ink:#0e131a;--primary-soft:#1d2d42;
  --accent:#f08a50;--accent-soft:#3a2518;
  --ok:#4cc38a;--ok-soft:#14301f;--warn:#e3a740;--warn-soft:#352812;
  --danger:#f0776b;--danger-soft:#3a1a17;--info:#6fa3df;--info-soft:#172a42;
  --c-in:#6fa3df;--c-out:#f08a50;
  --side:#0b1018;--side-text:#a9b5c3;--side-hover:#16202d;--side-active:#1d2d42;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#d0571f,#f0a050);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{font-size:11px;color:var(--side-text);opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-text);font-weight:500}
.nav a:hover{background:var(--side-hover);text-decoration:none;color:#fff}
.nav a.active{background:var(--side-active);color:#fff}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;background:#d0571f;color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:14px 10px 6px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side-foot label{display:block;margin-bottom:4px;opacity:.75}
.side-foot select{width:100%;background:var(--side-hover);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:7px 8px}
.demo-note{margin-top:10px;opacity:.65;line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 24px}
.topbar h1{font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.search{position:relative;margin-left:auto;width:min(340px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:40}
.search-res a{display:flex;gap:10px;padding:9px 12px;color:var(--text);border-bottom:1px solid var(--border)}
.search-res a:last-child{border-bottom:0}
.search-res a:hover,.search-res a:focus{background:var(--surface-2);text-decoration:none}
.search-res .k{font-size:11px;color:var(--muted);min-width:64px}
.content{padding:22px 24px 48px;max-width:1440px;width:100%}
.scrim{display:none}

/* Components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;font-weight:650}
.card-b{padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .s.bad{color:var(--danger)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.nowrap{white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{color:var(--danger)}
.btn-sm{padding:5px 9px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;cursor:pointer;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}.b-info{background:var(--info-soft);color:var(--info)}
.b-accent{background:var(--accent-soft);color:var(--accent)}.b-primary{background:var(--primary-soft);color:var(--primary)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:650;background:var(--surface-2)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:340px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .c{font-size:11px;background:var(--surface-2);border-radius:99px;padding:1px 6px;margin-left:4px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .t{font-weight:550}
.li .m{font-size:12px;color:var(--muted)}
.chk{width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer;flex:none}
.done .t{text-decoration:line-through;color:var(--faint)}
.overdue{color:var(--danger);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.chart .grid-l{stroke:var(--border)}

/* Detail */
.detail-h{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:18px}
.detail-h h2{font-size:20px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--border)}
.stats>div{padding:12px 18px;border-right:1px solid var(--border)}
.stats>div:last-child{border-right:0}
.stats .l{font-size:12px;color:var(--muted)}
.stats .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px}
.info-grid .l{font-size:12px;color:var(--muted)}
.info-grid .v{font-weight:550;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.tl:last-child{border-bottom:0}
.tl-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px}
.tl .h{font-size:12px;color:var(--muted)}
.tl .x{white-space:pre-wrap;margin-top:2px}
.quick{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:8px;margin-bottom:12px}
.quick select,.quick textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);resize:vertical}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:2px}
.step{flex:1;min-width:96px;border:0;cursor:pointer;background:var(--surface-2);color:var(--muted);padding:8px 10px;font-size:12px;font-weight:600;border-radius:7px;text-align:center;white-space:nowrap}
.step.past{background:var(--primary-soft);color:var(--primary)}
.step.cur{background:var(--primary);color:var(--primary-ink)}
.totals{margin-left:auto;width:min(320px,100%)}
.totals div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.totals .big{font-size:17px;font-weight:700;border-top:1px solid var(--border);margin-top:4px;padding-top:9px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:200px}
.col-h{padding:12px 12px 8px;border-top:3px solid var(--primary);border-radius:var(--radius) var(--radius) 0 0}
.col-h b{font-size:13px}
.col-h .s{font-size:12px;color:var(--muted)}
.col-b{padding:6px 8px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.over{outline:2px dashed var(--primary);outline-offset:-2px}
.deal{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow)}
.deal:active{cursor:grabbing}
.deal .t{font-weight:600;font-size:13px}
.deal .c{font-size:12px;color:var(--muted);margin-top:2px}
.deal .f{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.deal .val{font-weight:700;font-variant-numeric:tabular-nums}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,26,.5);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .12s}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:16px;flex:1}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.lines input,.lines select{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
.fld textarea{min-height:72px;resize:vertical}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:6px;border-top:1px solid var(--border);padding-top:12px}
.lines{width:100%;border-collapse:collapse;margin-top:6px;min-width:640px}
.lines th{font-size:11.5px;color:var(--muted);text-align:left;padding:6px 4px;font-weight:600}
.lines td{padding:4px;vertical-align:top}
.lines td:first-child{display:flex;flex-direction:column;gap:4px}
.lines .num{padding-top:12px}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}

/* Menu + toasts */
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);min-width:220px;padding:6px;z-index:50}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.rel{position:relative}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-weight:500;animation:up .2s;max-width:340px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.print-only{display:none}

@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:256px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap}
  .search{order:5;width:100%;margin-left:0}
  .topbar .new-wrap{margin-left:auto}
  .content{padding:16px 16px 40px}
  .fgrid,.fgrid.c3{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:17px}
  .toolbar input[type=search]{min-width:0;max-width:none;width:100%}
}
@media print{
  body{background:#fff;color:#000}
  .sidebar,.topbar,.no-print,#toasts,.scrim{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc}
  .print-only{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación">
    <div class="brand"><div class="brand-mark">AG</div><div><b>AACKS Group</b><small>CRM · Equipo para fundición</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <label for="userSel">Trabajando como</label>
      <select id="userSel" data-ui-user></select>
      <div class="demo-note">Versión demo · los datos se guardan en este navegador.</div>
    </div>
  </aside>
  <div class="scrim" data-act="closeNav"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-act="openNav" aria-label="Abrir menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Panel</h1>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Buscar cliente, pedido, OC, producto…" autocomplete="off" aria-label="Búsqueda global">
        <div id="gres"></div>
      </div>
      <div class="rel new-wrap">
        <button class="btn btn-primary" data-act="toggleNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
        <div id="newMenu"></div>
      </div>

/* ============ Cálculos ============ */
const lineImp = l => num(l.cant) * num(l.precio) * (1 - num(l.dto) / 100);
function totals(o){
  const sub = sum(o.lineas, lineImp), iva = sub * num(o.iva) / 100, total = r2(sub + iva);
  const pagado = r2(sum(DB.movimientos.filter(m => m.ordenId === o.id), m => m.monto));
  return {sub, iva, total, pagado, saldo: Math.max(0, r2(total - pagado))};
}
const isClosed = o => o.tipo === 'venta' ? ['Cerrada','Cancelada'].includes(o.estatus) : ['Recibida','Cancelada'].includes(o.estatus);
function payState(o){
  if (o.estatus === 'Cancelada') return ['Cancelada', 'b-danger'];
  const t = totals(o);
  if (t.total > 0 && t.saldo <= 0.5) return ['Pagada', 'b-ok'];
  if (o.vence && o.vence < today() && t.saldo > 0.5) return ['Vencida', 'b-danger'];
  if (t.pagado > 0) return ['Parcial', 'b-warn'];
  return ['Sin pago', ''];
}
function saldoBanco(id){ const b = byId(DB.bancos, id); return r2((b ? num(b.saldoInicial) : 0) + sum(DB.movimientos.filter(m => m.bancoId === id), m => m.tipo === 'ingreso' ? m.monto : -m.monto)); }
function pendientes(tipo){ return DB.ordenes.filter(o => o.tipo === tipo && o.estatus !== 'Cancelada').map(o => ({o, t: totals(o)})).filter(x => x.t.saldo > 0.5).map(x => ({...x, dias: x.o.vence ? daysBetween(x.o.vence, today()) : 0})); }
function cuentaStats(id){
  const os = DB.ordenes.filter(o => o.cuentaId === id && o.estatus !== 'Cancelada');
  const ts = os.map(totals);
  const ups = DB.updates.filter(u => u.cuentaId === id).map(u => u.fecha).sort();
  return {total: sum(ts, t => t.total), pagado: sum(ts, t => t.pagado), saldo: sum(ts, t => t.saldo), activas: os.filter(o => !isClosed(o)).length, n: os.length, ultimo: ups[ups.length - 1] || ''};
}
function nextFolio(tipo){
  const pre = (tipo === 'venta' ? 'PED-' : 'OCP-') + new Date().getFullYear() + '-';
  const n = Math.max(0, ...DB.ordenes.filter(o => o.folio.startsWith(pre)).map(o => parseInt(o.folio.slice(pre.length)) || 0)) + 1;
  return pre + String(n).padStart(3, '0');
}

    <td style="width:140px"><input data-k="precio" type="number" min="0" step="any" value="${l.precio ?? 0}" aria-label="Precio unitario"></td>

function readLines(f){ return $$('.line', f).map(r => ({productoId: $('[data-k=prod]', r).value, desc: $('[data-k=desc]', r).value, cant: num($('[data-k=cant]', r).value), precio: num($('[data-k=precio]', r).value), dto: num($('[data-k=dto]', r).value)})); }
function recalcLines(f){
  const ls = readLines(f); $$('.line', f).forEach((r, i) => $('[data-k=imp]', r).textContent = money2(lineImp(ls[i])));
  const sub = sum(ls, lineImp), iva = sub * num(f.iva.value) / 100;

}

function chartFlujo(){
  const now = new Date(), ms = [];
  for (let i = 5; i >= 0; i--){ const x = new Date(now.getFullYear(), now.getMonth() - i, 1); const key = iso(x).slice(0, 7); ms.push({key, label: x.toLocaleDateString('es-MX', {month: 'short'}).replace('.', ''), in: sum(DB.movimientos.filter(m => m.tipo === 'ingreso' && m.fecha.startsWith(key)), m => m.monto), out: sum(DB.movimientos.filter(m => m.tipo === 'egreso' && m.fecha.startsWith(key)), m => m.monto)}); }
  const raw = Math.max(1, ...ms.flatMap(m => [m.in, m.out]));
  const p = Math.pow(10, Math.floor(Math.log10(raw))); const max = Math.ceil(raw / p / (raw / p > 5 ? 2 : 1)) * p * (raw / p > 5 ? 2 : 1);
  const W = 640, H = 230, L = 52, B = 26, T = 8, pw = W - L - 8, ph = H - B - T, gw = pw / ms.length, bw = Math.min(26, gw * .3);
  let g = '';
  for (let i = 0; i <= 4; i++){ const y = T + ph - ph * i / 4; g += `<line class="grid-l" x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${compact(max * i / 4)}</text>`; }
  ms.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, hi = ph * m.in / max, ho = ph * m.out / max;
    g += `<rect x="${cx - bw - 2}" y="${T + ph - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--c-in)"><title>Ingresos ${m.label}: ${money(m.in)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${T + ph - ho}" width="${bw}" height="${ho}" rx="3" fill="var(--c-out)"><title>Egresos ${m.label}: ${money(m.out)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 7}" text-anchor="middle" style="text-transform:capitalize${i === 5 ? ';font-weight:600;fill:var(--text)' : ''}">${m.label}</text>`;
  });
  const net = sum(ms, m => m.in - m.out);
  return {svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos de los últimos 6 meses">${g}</svg>`, net};
}

  return `<div class="li ${t.hecho ? 'done' : ''}"><input type="checkbox" class="chk" ${t.hecho ? 'checked' : ''} data-act="toggleTask" data-id="${t.id}" aria-label="Completar"><div style="flex:1;min-width:0"><div class="t">${esc(t.titulo)}</div>
    <div class="m">${esc(t.tipo)}${t.cuentaId ? ` · <a href="#cliente/${t.cuentaId}">${esc(cname(t.cuentaId))}</a>` : ''} · ${esc(user(t.responsable).nombre)} · <span class="${od ? 'overdue' : ''}">${t.fecha === today() ? 'Hoy' : fdate(t.fecha, false)}${od ? ' (vencida)' : ''}</span></div></div>
    ${t.prioridad === 'Alta' && !t.hecho ? badge('Alta') : ''}<button class="icon-btn" data-act="editTarea" data-id="${t.id}" aria-label="Editar">✎</button></div>`;
}

/* ---- Clientes ---- */
function vClientes(){

  if (UI.clEst !== 'Todos') list = list.filter(c => c.estatus === UI.clEst);

  const rows = list.map(c => { const st = cuentaStats(c.id), k = c.contactos?.[0]; return `<tr class="click" data-act="go" data-href="#cliente/${c.id}">
    <td><div class="cell-main">${esc(c.nombre)}</div><div class="cell-sub">${esc(c.sector || '')}</div></td><td>${esc(c.ciudad || '')}</td>
    <td>${k ? `<div>${esc(k.nombre)}</div><div class="cell-sub">${esc(k.tel || k.email || '')}</div>` : '—'}</td><td>${badge(c.estatus)}</td>

    case 'pagos': body = `<div class="card table-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Concepto</th><th>Orden</th><th>Cuenta</th><th>Método</th><th class="num">Monto</th></tr></thead><tbody>

/* ---- Órdenes ---- */
function ordTable(list, showCli = false){
  const rows = list.map(o => { const t = totals(o), ps = payState(o); return `<tr class="click" data-act="go" data-href="#orden/${o.id}">
    <td><div class="cell-main nowrap">${esc(o.folio)}</div>${o.ocCliente ? `<div class="cell-sub">${o.tipo === 'venta' ? 'OC ' : 'Ref. '}${esc(o.ocCliente)}</div>` : ''}</td>
    ${showCli ? `<td>${esc(cname(o.cuentaId))}</td>` : ''}<td>${fdate(o.fecha)}</td><td>${fdate(o.entrega)}</td><td>${ordStatusBadge(o)}</td>
    <td class="num">${money(t.total)}</td><td class="num">${money(t.pagado)}</td><td class="num">${t.saldo ? money(t.saldo) : '—'}</td><td>${badge(ps[0], ps[1])}</td></tr>`; }).join('');
  const ts = list.filter(o => o.estatus !== 'Cancelada').map(totals);
  return `<div class="card table-wrap"><table class="tbl"><thead><tr><th>Folio</th>${showCli ? '<th>Cliente / proveedor</th>' : ''}<th>Fecha</th><th>Entrega</th><th>Estatus</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Saldo</th><th>Pago</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="9">${empty('Sin órdenes')}</td></tr>`}</tbody>
    ${list.length ? `<tfoot><tr><td colspan="${showCli ? 5 : 4}">${list.length} orden(es) · sin canceladas</td><td class="num">${money(sum(ts, t => t.total))}</td><td class="num">${money(sum(ts, t => t.pagado))}</td><td class="num">${money(sum(ts, t => t.saldo))}</td><td></td></tr></tfoot>` : ''}</table></div>`;
}
function vOrdenes(){
  const tipo = UI.ordTipo, q = UI.ordQ.trim().toLowerCase();
  let list = DB.ordenes.filter(o => o.tipo === tipo);
  if (q) list = list.filter(o => [o.folio, o.ocCliente, cname(o.cuentaId), o.notas, ...o.lineas.map(l => l.desc)].join(' ').toLowerCase().includes(q));
  if (UI.ordEst === 'Abiertas') list = list.filter(o => !isClosed(o)); else if (UI.ordEst === 'Con saldo') list = list.filter(o => o.estatus !== 'Cancelada' && totals(o).saldo > 0); else if (UI.ordEst !== 'Todas') list = list.filter(o => o.estatus === UI.ordEst);
  list.sort((a, b) => b.fecha.localeCompare(a.fecha) || b.folio.localeCompare(a.folio));
  const ests = ['Todas', 'Abiertas', 'Con saldo', ...(tipo === 'venta' ? EST_VENTA : EST_COMPRA)];
  return {title: 'Órdenes', html: `
  <div class="toolbar">${seg('ordTipo', [['venta', 'Órdenes de clientes'], ['compra', 'Compras a proveedores']])}
    <input type="search" id="ordQ" data-ui="ordQ" value="${esc(UI.ordQ)}" placeholder="Folio, OC, cliente, producto…" aria-label="Buscar órdenes">
    <select data-ui="ordEst" aria-label="Filtrar estatus">${ests.map(s => `<option ${UI.ordEst === s ? 'selected' : ''}>${s}</option>`).join('')}</select>

  ${ordTable(list, true)}`};
}
function vOrden(id){

  const ae = document.activeElement, focusId = ae && ae.id && $('#view').contains(ae) ? ae.id : null, caret = focusId && ae.selectionStart;
  const r = V(id);
  $('#view').innerHTML = r.html;
  $('#pageTitle').textContent = r.title;
  document.title = r.title + ' · AACKS Group CRM';
  renderNav(NAV_OF[view] || (VIEWS[view] ? view : 'panel'));
  r.after && r.after();
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} } }
}

  if (DL){ try { await DL.save({filename: name, data: new Blob([content], {type})}); toast('Archivo descargado'); } catch(e){ if (e && e.code !== 'declined') toast('No se pudo descargar aquí'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const A = {
  go: ds => { location.hash = ds.href; },
  ui: ds => { UI[ds.k] = ds.v; if (ds.k === 'clTipo' && location.hash.startsWith('#cliente/')) return; if (ds.k === 'ordTipo') UI.ordEst = 'Todas'; render(); },

  newCuenta: ds => formCuenta(null, ds.tipo || 'cliente'),
  editCuenta: ds => formCuenta(ds.id),
  delCuenta: ds => { const c = cuenta(ds.id); if (DB.ordenes.some(o => o.cuentaId === ds.id)){ alert('No se puede eliminar: tiene órdenes registradas. Cámbialo a "Inactivo".'); return; } if (confirm(`¿Eliminar ${c.nombre}?`)){ DB.cuentas = DB.cuentas.filter(x => x.id !== ds.id); DB.updates = DB.updates.filter(u => u.cuentaId !== ds.id); log(`Eliminó a ${c.nombre}`); save(); location.hash = '#clientes'; } },
  newContacto: ds => formContacto(ds.cid),
  editContacto: ds => formContacto(ds.cid, ds.id),
  delContacto: ds => { const c = cuenta(ds.cid); if (confirm('¿Eliminar contacto?')){ c.contactos = c.contactos.filter(k => k.id !== ds.id); save(); render(); } },
  newUpdate: ds => formUpdate(ds.cid || ''),
  delUpd: ds => { if (confirm('¿Eliminar esta actualización?')){ DB.updates = DB.updates.filter(u => u.id !== ds.id); save(); render(); } },
  newOrden: ds => formOrden(null, {tipo: ds.tipo || 'venta', cuentaId: ds.cid}),
  editOrden: ds => formOrden(ds.id),
  addLine: (ds) => { const tb = $('#lines'); tb.insertAdjacentHTML('beforeend', lineRow({cant: 1, precio: 0, dto: 0}, ds.tipo)); recalcLines($('#mform')); },
  delLine: (ds, el) => { const f = $('#mform'); if ($$('.line', f).length > 1){ el.closest('.line').remove(); recalcLines(f); } },
  setEstatus: ds => { const o = byId(DB.ordenes, ds.id); if (o.estatus === ds.v) return; o.estatus = ds.v; log(`Cambió ${o.folio} a "${ds.v}"`); save(); render(); toast('Estatus: ' + ds.v); },
  pago: ds => formPago(ds.id),
  setMonto: ds => { $('#pMonto').value = ds.v; },
  dupOrden: ds => { const o = byId(DB.ordenes, ds.id); formOrden(null, {tipo: o.tipo, cuentaId: o.cuentaId, lineas: JSON.parse(JSON.stringify(o.lineas)), notas: o.notas}); },
  ordenToCompra: ds => { const o = byId(DB.ordenes, ds.id); const lineas = o.lineas.filter(l => { const p = byId(DB.productos, l.productoId); return p && p.marca !== 'AACKS Group'; }).map(l => ({...l, precio: byId(DB.productos, l.productoId).costo, dto: 0})); const marca = lineas[0] && byId(DB.productos, lineas[0].productoId).marca; const prov = DB.cuentas.find(c => c.tipo === 'proveedor' && marca && c.nombre.toLowerCase().includes(marca.split(' ')[0].toLowerCase())); formOrden(null, {tipo: 'compra', cuentaId: prov ? prov.id : '', ordenVentaId: o.id, lineas: lineas.length ? lineas : [{cant: 1, precio: 0, dto: 0}], notas: `Para pedido ${o.folio} de ${cname(o.cuentaId)}`}); },
  delOrden: ds => { const o = byId(DB.ordenes, ds.id); if (confirm(`¿Eliminar ${o.folio} y sus pagos registrados?`)){ DB.ordenes = DB.ordenes.filter(x => x.id !== ds.id); DB.movimientos = DB.movimientos.filter(m => m.ordenId !== ds.id); log(`Eliminó la orden ${o.folio}`); save(); location.hash = '#ordenes'; toast('Orden eliminada'); } },
  print: () => window.print(),
  newMov: ds => formMov(ds.tipo || 'ingreso'),
  editMov: ds => formMov(null, ds.id),
  delMov: ds => { if (confirm('¿Eliminar este movimiento?')){ DB.movimientos = DB.movimientos.filter(m => m.id !== ds.id); log('Eliminó un movimiento financiero'); save(); render(); } },
  newBanco: () => formBanco(),
  editBanco: ds => formBanco(ds.id),
  csv: () => { const rows = [['Fecha','Tipo','Concepto','Categoría','Cliente/Proveedor','Orden','Cuenta','Método','Referencia','Monto']].concat(DB.movimientos.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).map(m => [m.fecha, m.tipo, m.concepto, m.categoria, m.cuentaId ? cname(m.cuentaId) : '', (byId(DB.ordenes, m.ordenId) || {}).folio || '', (byId(DB.bancos, m.bancoId) || {}).nombre || '', m.metodo, m.referencia || '', (m.tipo === 'egreso' ? -m.monto : m.monto).toFixed(2)])); download('movimientos-aacks.csv', '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv'); },
  newProducto: () => formProducto(),
  editProducto: ds => formProducto(ds.id),
  newOport: ds => formOport(null, {cuentaId: ds.cid}),
  editOport: ds => formOport(ds.id),
  delOport: ds => { if (confirm('¿Eliminar oportunidad?')){ DB.oportunidades = DB.oportunidades.filter(o => o.id !== ds.id); closeModal(); save(); render(); } },
  oportToOrder: ds => { const o = byId(DB.oportunidades, ds.id); o.etapa = 'Ganada'; o.prob = 100; log(`Ganó la oportunidad "${o.titulo}"`); save(); closeModal(); formOrden(null, {tipo: 'venta', cuentaId: o.cuentaId, notas: 'Oportunidad: ' + o.titulo, lineas: [{desc: o.titulo, cant: 1, precio: o.valor, dto: 0}]}); },
  newTarea: ds => formTarea(null, {cuentaId: ds.cid}),
  editTarea: ds => formTarea(ds.id),
  delTarea: ds => { DB.tareas = DB.tareas.filter(t => t.id !== ds.id); closeModal(); save(); render(); },
  toggleTask: ds => { const t = byId(DB.tareas, ds.id); t.hecho = !t.hecho; if (t.hecho) log(`Completó: ${t.titulo}`); save(); render(); if (t.hecho) toast('Tarea completada'); },
  newEquipo: ds => formEquipo(ds.cid),
  editEquipo: ds => formEquipo(null, ds.id),
  delEquipo: ds => { if (confirm('¿Eliminar equipo?')){ DB.equipos = DB.equipos.filter(e => e.id !== ds.id); closeModal(); save(); render(); } },
  programarMant: ds => { const e = byId(DB.equipos, ds.id); formTarea(null, {cuentaId: e.cuentaId}); const f = $('#mform'); f.titulo.value = `Mantenimiento preventivo: ${e.descripcion} (serie ${e.serie || 's/n'})`; f.tipo.value = 'Servicio'; f.fecha.value = e.proxMant && e.proxMant > today() ? e.proxMant : today(); f.responsable.value = (DB.team.find(u => /servicio/i.test(u.rol)) || me()).id; },
  newUser: () => openModal({title: 'Agregar persona al equipo', body: `<div class="fgrid">${fld('Nombre completo', inp('nombre', '', 'required'))}${fld('Puesto / área', inp('rol', ''))}</div>`, onSubmit: d => { DB.team.push({id: uid('u'), nombre: d.nombre, rol: d.rol}); toast('Persona agregada'); }}),
  setUser: ds => { DB.settings.usuario = ds.id; save(); render(); toast('Ahora trabajas como ' + me().nombre); },
  exportJSON: () => download(`respaldo-crm-aacks-${today()}.json`, JSON.stringify(DB, null, 2), 'application/json'),
  reset: () => { if (confirm('Se borrarán todos los cambios y se cargarán los datos de ejemplo. ¿Continuar?')){ DB = seed(); save(); location.hash = '#panel'; render(); toast('Datos demo restablecidos'); } },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!e.target.closest('.new-wrap') && $('#newMenu').innerHTML) $('#newMenu').innerHTML = '';
  if (!e.target.closest('.search')) $('#gres').innerHTML = '';
  if (!a) return;
  if (a.type === 'checkbox'){ A[a.dataset.act]?.(a.dataset, a, e); return; }
  if (a.tagName === 'A' && a.getAttribute('href') && a.dataset.act === 'ui'){ UI[a.dataset.k] = a.dataset.v; if (location.hash === a.getAttribute('href')) render(); return; }
  if (e.target.closest('a[href]') && e.target.closest('a[href]') !== a && a.contains(e.target.closest('a[href]'))) return;
  if (A[a.dataset.act]){ if (a.dataset.act !== 'bgClose') e.preventDefault(); if (a.closest('.menu')) $('#newMenu').innerHTML = ''; A[a.dataset.act](a.dataset, a, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modalRoot').innerHTML) closeModal(); $('#newMenu').innerHTML = ''; $('#gres').innerHTML = ''; document.body.classList.remove('nav-open'); }
  if (e.key === 'Enter' && e.target.matches('.deal')) A.editOport(e.target.dataset);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#gsearch').focus(); }
});
document.addEventListener('input', e => { const k = e.target.dataset.ui; if (k){ UI[k] = e.target.value; render(); } });
document.addEventListener('change', e => {
  const k = e.target.dataset.ui; if (k && e.target.tagName === 'SELECT'){ UI[k] = e.target.value; render(); }
  if (e.target.id === 'userSel'){ DB.settings.usuario = e.target.value; save(); render(); toast('Ahora trabajas como ' + me().nombre); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'quickUpd'){ e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); if (!d.texto.trim()) return; addUpdate(e.target.dataset.cid, d.tipo, d.texto); save(); render(); }
});

/* Búsqueda global */
$('#gsearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(); const box = $('#gres');
  if (q.length < 2){ box.innerHTML = ''; return; }
  const res = [];
  DB.cuentas.forEach(c => { if ([c.nombre, c.ciudad, c.rfc, ...c.contactos.map(k => k.nombre)].join(' ').toLowerCase().includes(q)) res.push([c.tipo === 'cliente' ? 'Cliente' : 'Proveedor', c.nombre, c.ciudad, '#cliente/' + c.id]); });
  DB.ordenes.forEach(o => { if ([o.folio, o.ocCliente].join(' ').toLowerCase().includes(q)) res.push([o.tipo === 'venta' ? 'Pedido' : 'Compra', o.folio + (o.ocCliente ? ' · ' + o.ocCliente : ''), cname(o.cuentaId), '#orden/' + o.id]); });
  DB.productos.forEach(p => { if ([p.sku, p.nombre, p.marca].join(' ').toLowerCase().includes(q)) res.push(['Producto', p.nombre, p.sku, '#catalogo']); });
  box.innerHTML = `<div class="search-res">${res.slice(0, 8).map(([k, t, s, h]) => `<a href="${h}" data-gs><span class="k">${k}</span><span style="min-width:0"><b>${esc(t)}</b><br><span class="muted" style="font-size:12px">${esc(s || '')}</span></span></a>`).join('') || '<div class="empty" style="padding:14px">Sin resultados</div>'}</div>`;
});
$('#gres').addEventListener('click', e => { if (e.target.closest('a')){ $('#gsearch').value = ''; setTimeout(() => $('#gres').innerHTML = '', 0); } });

load();
render();
</script>
</body>
</html>
